[package]
name = "rustly-forge"
version = "0.1.0"
edition = "2021"
authors = ["Rustly Forge Team"]
description = "Rustly Forge is an open-source, Rust-powered engineering canvas for sketching, designing, and experimenting with circuits, geometry, and technical ideas."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2.92"
console_error_panic_hook = "0.1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
gloo-storage = "0.3.0"
gloo-net = "0.5.0"
gloo-events = "0.2.0"
web-sys = { version = "0.3.69", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "Storage",
    "DomRect",
    "Blob",
    "Url",
    "HtmlAnchorElement",
    "ImageData",
    "Performance"
] }
js-sys = "0.3.69"
aes-gcm = { version = "0.10.3", optional = true }

[features]
default = []
e2ee = ["dep:aes-gcm"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
